name: Release

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Play Store track
        required: true
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android → Play Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Resolve deploy track
        id: track
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.play_track }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/biztrack-release.jks

      - name: Restore key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "ANDROID_KEY_PROPERTIES secret is not set"
            exit 1
          fi
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > key.properties

      - name: Restore Play Store service account
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          printf '%s\n' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > fastlane/play-store-service-account.json

      - name: Install Flutter dependencies
        working-directory: ..
        run: flutter pub get

      - name: Deploy to Play Console
        env:
          PLAY_STORE_JSON_KEY_FILE: fastlane/play-store-service-account.json
          PLAY_STORE_TRACK: ${{ steps.track.outputs.value }}
          PACKAGE_NAME: ai.biztrack
          ANDROID_ARTIFACT_PATH: build/app/outputs/bundle/productionRelease/app-production-release.aab
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ steps.track.outputs.value }}" = "production" ]; then
            bundle exec fastlane deploy
          else
            bundle exec fastlane playstore_${{ steps.track.outputs.value }}
          fi

  ios:
    name: iOS → TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods
        run: pod install

      - name: Restore App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "APP_STORE_CONNECT_API_KEY secret is not set"
            exit 1
          fi
          mkdir -p fastlane/keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > fastlane/keys/AuthKey.p8

      - name: Import signing certificate
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$IOS_BUILD_CERTIFICATE_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "iOS signing secrets are not set"
            exit 1
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$IOS_BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILE_PATH=$RUNNER_TEMP/billmate.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Write App Store env
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > fastlane/.env.appstore <<EOF
          FLUTTER_BIN=${FLUTTER_ROOT}/bin/flutter
          APP_STORE_CONNECT_API_KEY_ID=${APP_STORE_CONNECT_API_KEY_ID}
          APP_STORE_CONNECT_ISSUER_ID=${APP_STORE_CONNECT_ISSUER_ID}
          APP_STORE_CONNECT_API_KEY_PATH=keys/AuthKey.p8
          EOF

      - name: Install Flutter dependencies
        working-directory: ..
        run: flutter pub get

      - name: Deploy to TestFlight
        run: bundle exec fastlane ios deploy
