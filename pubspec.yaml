  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  in_app_review: ^2.0.10
  injectable: ^2.5.0
  intl: ^0.20.0
  json_annotation: ^4.9.0
  json_serializable: ^6.9.3
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  pin_code_fields: ^8.0.1
  rps: ^0.7.0
  screenshot: ^3.0.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  skeletonizer: ^2.1.2
  sqflite: ^2.4.1
  talker_dio_logger: ^4.6.4
  talker_flutter: ^4.6.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  font_awesome_flutter: ^10.8.0
  firebase_database: ^11.3.9
  change_app_package_name: ^1.5.0
  barcode: ^2.2.9
  pdf: ^3.11.1
  open_file: ^3.5.3
  printing: ^5.11.1
  print_bluetooth_thermal: ^1.1.6
  image: ^4.3.0
  gal: ^2.3.1
  excel: ^4.0.3
  table_calendar: ^3.1.2
  syncfusion_flutter_datepicker: ^28.1.38
