  in_app_purchase_storekit: ^0.4.11
  flutter_email_sender: ^9.0.0
  flutter_native_splash: ^2.4.4
  iconsax_flutter: ^1.0.1

dev_dependencies:
  auto_route_generator: ^9.3.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  injectable_generator: null

flutter_native_splash:
  color_ios: "#FFFFFF"
  image_ios: assets/images/splash_ios.png
  ios_content_mode: scaleAspectFit
  color_android: "#FFFFFF"
  image_android: assets/images/splash_ios.png
  android_gravity: center
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_ios.png


# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/android_app_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/splash_ios.png"

  ios: false
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false



flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - .env-dev
    - .env-staging
    - .env-prod
    - assets/icons/
    - assets/svg/
    - assets/images/
    - assets/data/books_schema.sql
    - assets/data/invoice_return_tables.sql
    - assets/data/backup_change_log.sql
    - assets/data/chart_of_accounts.json
    - assets/data/default_books_settings.json
    - assets/data/currency.csv
    - assets/data/currency_countries.json
    - assets/l10n/languages.json
    - assets/config/force_update_policy.json
    # Noto only — Inter is loaded via [fonts:] below, not as a raw asset.
    - assets/fonts/NotoSansDevanagari-Bold.ttf

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-dir: lib/l10n
  synthetic-package: false

